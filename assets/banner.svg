<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Keyframe Animations */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashSignal {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scanRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .node { transform-origin: center; animation: pulseNode 4s infinite ease-in-out; }
    .node-delay1 { animation-delay: 1s; }
    .node-delay2 { animation-delay: 2s; }
    .signal { stroke-dasharray: 8 8; animation: dashSignal 2s linear infinite; }
    .particle { animation: floatParticle 6s infinite ease-in-out; }
    .radar-sweep { transform-origin: 1000px 180px; animation: scanRadar 10s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/>
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/>
  </g>

  <!-- Radar / Service Network Visual (Right Side background) -->
  <g opacity="0.6">
    <circle cx="1000" cy="180" r="130" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1000" cy="180" r="80" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1000" cy="180" r="30" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    
    <!-- Radar Line -->
    <line x1="1000" y1="180" x2="1130" y2="180" stroke="url(#titleGrad)" stroke-width="2" class="radar-sweep"/>

    <!-- Connecting Mesh Lines -->
    <path d="M 880,120 L 950,180 L 1000,100 L 1080,140 L 1120,220 L 1020,250 L 930,230 Z" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
    <path d="M 950,180 L 1080,140 M 1000,100 L 1020,250 M 880,120 L 1020,250" fill="none" class="signal" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Service Nodes -->
    <circle cx="880" cy="120" r="7" fill="#38bdf8" class="node"/>
    <circle cx="950" cy="180" r="9" fill="#818cf8" class="node node-delay1"/>
    <circle cx="1000" cy="100" r="6" fill="#c084fc" class="node node-delay2"/>
    <circle cx="1080" cy="140" r="8" fill="#38bdf8" class="node"/>
    <circle cx="1120" cy="220" r="7" fill="#818cf8" class="node node-delay1"/>
    <circle cx="1020" cy="250" r="10" fill="#38bdf8" class="node node-delay2"/>
    <circle cx="930" cy="230" r="6" fill="#c084fc" class="node"/>
  </g>

  <!-- Ambient Floating Particles -->
  <circle cx="150" cy="80" r="3" fill="#38bdf8" class="particle"/>
  <circle cx="450" cy="300" r="4" fill="#818cf8" class="particle" style="animation-delay: 2s;"/>
  <circle cx="700" cy="70" r="2.5" fill="#c084fc" class="particle" style="animation-delay: 4s;"/>

  <!-- Foreground Content (Left Aligned for Crystal Clarity) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="19" class="tag">☁️ CLOUD SERVICE DISCOVERY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title" filter="url(#glow)">Awesome Cloud Service Discovery 🔍</text>
    
    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Enterprise Service Registries, DNS Discovery &amp; Service Mesh Architecture</text>

    <!-- Category Highlights -->
    <g transform="translate(0, 255)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">🌐 DNS Registries</text>

      <!-- Item 2 -->
      <rect x="175" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="187" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">🕸️ Service Mesh Integration</text>

      <!-- Item 3 -->
      <rect x="370" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="382" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">⚡ Key-Value Stores</text>
    </g>
  </g>
</svg>
